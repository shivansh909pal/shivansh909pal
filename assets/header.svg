<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f15"/>
      <stop offset="1" stop-color="#1a1d12"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86e08f"/>
      <stop offset="1" stop-color="#e8c36a"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="338" rx="18" fill="url(#bg)" stroke="#2f4a37" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="46" rx="18" fill="#16251b"/>
  <rect x="1" y="30" width="998" height="17" fill="#16251b"/>

  <!-- window dots -->
  <circle cx="32" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="24" r="7" fill="#27c93f"/>
  <text x="500" y="29" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#7d9484">shivanshpal ~/profile</text>

  <!-- left side -->
  <text x="48" y="105" font-family="Courier New, monospace" font-size="22" fill="#e6efe8">
    <tspan fill="#86e08f">$</tspan> whoami
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze"/>
  </text>

  <text x="48" y="190" font-family="Courier New, monospace" font-size="62" font-weight="bold" fill="url(#name)" opacity="0">
    Shivansh Pal
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.8s" fill="freeze"/>
  </text>

  <text x="50" y="235" font-family="Courier New, monospace" font-size="26" fill="#cfd8d1" opacity="0">
    Aspiring Software Engineer
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.8s" fill="freeze"/>
  </text>

  <text x="50" y="298" font-family="Courier New, monospace" font-size="17" fill="#6f8577" opacity="0">
    // I learn by building first, then tidying up the basics
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.8s" fill="freeze"/>
  </text>
  <rect x="640" y="283" width="10" height="20" fill="#86e08f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- status panel -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.8s" fill="freeze"/>
    <rect x="720" y="85" width="240" height="170" rx="14" fill="#0e1912" stroke="#2f6b45" stroke-width="1.5"/>
    <text x="740" y="115" font-family="Courier New, monospace" font-size="13" letter-spacing="2" fill="#7d9484">PROFILE.STATUS</text>
    <circle cx="938" cy="110" r="5" fill="#27c93f">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Courier New, monospace" font-size="15">
      <text x="740" y="148" fill="#7d9484">status</text>
      <text x="820" y="148" fill="#86e08f" font-weight="bold">building</text>

      <text x="740" y="256" fill="#7d9484" opacity="0"></text>

      <text x="740" y="178" fill="#7d9484">focus</text>
      <text x="820" y="178" fill="#e6efe8" font-weight="bold">Web · ML · DSA</text>

      <text x="740" y="208" fill="#7d9484">stack</text>
      <text x="820" y="208" fill="#e6efe8" font-weight="bold">Python · Java</text>

      <text x="740" y="238" fill="#7d9484">open to</text>
      <text x="820" y="238" fill="#e8c36a" font-weight="bold">internships</text>
    </g>
  </g>
</svg>
